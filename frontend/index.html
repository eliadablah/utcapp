<!DOCTYPE html>
<!--
  UTC Student Services Portal - single page shell.
  The page itself is almost empty: js/app.js draws the sidebar and whichever
  view matches the address bar (#/dashboard, #/documents, ...).
  Scripts are plain files (no build step) so the page also opens by double-click.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UTC Student Services Portal</title>
  <link rel="stylesheet" href="styles/tokens.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div id="app"></div>
  <noscript>This portal needs JavaScript turned on.</noscript>

  <!-- Order matters: shared pieces first, then components, then views, then the app -->
  <script src="js/content.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/backends/local.js"></script>
  <script src="js/backends/remote.js"></script>
  <script src="js/store.js"></script>
  <script src="js/enrollmentStatus.js"></script>
  <script src="js/serverInfo.js"></script>
  <script src="js/components/badge.js"></script>
  <script src="js/components/card.js"></script>
  <script src="js/components/emptyState.js"></script>
  <script src="js/components/field.js"></script>
  <script src="js/components/pageHeader.js"></script>
  <script src="js/components/statCard.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/enrollment.js"></script>
  <script src="js/views/documents.js"></script>
  <script src="js/views/labs.js"></script>
  <script src="js/views/support.js"></script>
  <script src="js/views/courses.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
